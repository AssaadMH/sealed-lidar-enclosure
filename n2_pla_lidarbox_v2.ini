# PrusaSlicer config - Raise3D N2 (300x300x300), PLA, YDLIDAR X2 enclosure V2
#
# Same profile as n2_pla_lidarbox.ini (V1). The two settings that matter for a
# sealed enclosure are unchanged because the wall is still 2.4 mm:
#   perimeters 6 + perimeter width 0.4  -> 6 x 0.4 = 2.4 exactly, so the wall is
#                          ALL perimeter with no gap-fill seam running up it
#   brim 5, no raft, no support
#
# V2-specific notes:
#   - The tub is now 46 mm tall on a 104 x 68.3 footprint (V1: 59 mm on
#     104 x 78.6). Still tall and narrow enough to want the brim.
#   - V2's corner posts run all the way to the floor and merge into the corner
#     fillets, so V1's 45 deg support-free starter cones are gone. Nothing in
#     the tub needs support.
#   - The collar flares outward at 34.06 deg from vertical on its Y sides.
#     That is well inside what prints unsupported - do NOT let the slicer add
#     support "to be safe", it would be inside the sealed joint face.
#   - The tub's 4 chassis-insert holes are blind and open DOWNWARD, so each has
#     a ceiling that bridges over O4 at 5.5 mm up. Trivial, but keep
#     bridge_speed low and the fan on.
#   - Lid is exported already inverted; collar prints flat face down. Do not
#     re-orient anything in the slicer.
printer_technology = FFF
gcode_flavor = marlin
bed_shape = 0x0,300x0,300x300,0x300
max_print_height = 300
nozzle_diameter = 0.4
z_offset = 0
use_relative_e_distances = 0
use_firmware_retraction = 0
retract_length = 1
retract_speed = 40
deretract_speed = 40
retract_lift = 0.2
retract_before_travel = 2

filament_diameter = 1.75
filament_type = PLA
filament_density = 1.24   # without this the gcode reports "filament used [g] = 0.00"
temperature = 205
first_layer_temperature = 210
bed_temperature = 60
first_layer_bed_temperature = 60
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
disable_fan_first_layers = 1
slowdown_below_layer_time = 12
min_print_speed = 10

layer_height = 0.15
first_layer_height = 0.20
perimeters = 6
extrusion_width = 0.45
perimeter_extrusion_width = 0.4
external_perimeter_extrusion_width = 0.4
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 25%
fill_pattern = grid
top_fill_pattern = monotonic
solid_infill_every_layers = 0
ensure_vertical_shell_thickness = 1

# brim only - no raft, no support
skirts = 0
brim_width = 5
support_material = 0
raft_layers = 0

perimeter_speed = 30
external_perimeter_speed = 25
small_perimeter_speed = 20
infill_speed = 60
solid_infill_speed = 50
top_solid_infill_speed = 30
travel_speed = 120
first_layer_speed = 20
bridge_speed = 30

start_gcode = G90\nM82\nM140 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nG28\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG92 E0\nG1 Z0.2 F3000\nG1 X6 Y6 F3000\nG1 X160 Y6 E12 F1200\nG1 X160 Y6.6 E12.6 F1200\nG1 X6 Y6.6 E24 F1200\nG92 E0\nG1 Z1 F3000
end_gcode = M104 S0\nM140 S0\nG91\nG1 E-2 F1800\nG1 Z10 F3000\nG90\nG1 X0 Y300 F6000\nM84
