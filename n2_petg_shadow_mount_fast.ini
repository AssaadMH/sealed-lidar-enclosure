# PrusaSlicer config - Raise3D N2, PETG, SHADOW front lidar mount - FAST
#
# Same part, same material, ~half the time. Derived from
# n2_petg_shadow_mount.ini; ONLY the settings below differ, and each one is
# a deliberate trade, not a blanket "go faster".
#
# WHERE THE TIME ACTUALLY WENT
#   The cradle extrudes 84.4 cm3 against a 90.7 cm3 solid - it is 93 %
#   perimeter, because its plates are 4-6 mm thick and 5 walls x 0.45 nearly
#   fills them. So infill density is almost irrelevant here; the time is in
#   layer count and in how much each perimeter pass lays down. That is what
#   this profile attacks.
#
#   layer_height  0.20 -> 0.30   fewer layers, more material per pass
#   width         0.45 -> 0.52   wider bead, so 4 walls >= the old 5
#   perimeters    5    -> 4      4 x 0.52 = 2.08 mm shell vs 5 x 0.45 = 2.25
#   infill        40%  -> 22%    barely moves the clock, and the shell is
#                                what carries load on a part this solid
#   speeds        up ~35 %       capped by max_volumetric_speed, not by the
#                                speed numbers - see below
#
# WHAT THIS COSTS
#   Surface finish. 0.30 mm layers on a 0.4 nozzle (75 % of nozzle diameter,
#   the usual ceiling) show visible stepping on the curved corners. This is a
#   bracket under a robot deck - nobody sees it.
#
#   It does NOT cost strength in any way that matters. Thicker PETG layers
#   generally bond BETTER, not worse, because each pass carries more heat into
#   the one below. The shell is within 8 % of the original and the loads are
#   trivial: the whole lidar is 0.25 kg, and the alu tube it hangs from
#   deflects 0.012 mm under it.
#
# MAX VOLUMETRIC SPEED IS THE REAL LIMIT
#   At 0.30 x 0.52 a 45 mm/s perimeter is already 7.0 mm3/s. The cap below
#   holds the whole print to 9 mm3/s so the extruder is never asked for more
#   than a stock hotend can melt - raising the speed numbers further would
#   just under-extrude. If you see gaps between walls, LOWER the cap, do not
#   raise the temperature past 250.
#
# Orientation, supports and material are unchanged - see the standard profile.
printer_technology = FFF
gcode_flavor = marlin
bed_shape = 0x0,300x0,300x300,0x300
max_print_height = 300
nozzle_diameter = 0.4
z_offset = 0
use_relative_e_distances = 0
use_firmware_retraction = 0
retract_length = 1.6
retract_speed = 30
deretract_speed = 30
retract_lift = 0.2
retract_before_travel = 2

filament_diameter = 1.75
filament_type = PETG
filament_density = 1.27
temperature = 248
first_layer_temperature = 248
bed_temperature = 80
first_layer_bed_temperature = 80
max_volumetric_speed = 9
fan_always_on = 1
min_fan_speed = 30
max_fan_speed = 50
disable_fan_first_layers = 3
slowdown_below_layer_time = 12
min_print_speed = 10

layer_height = 0.30
first_layer_height = 0.30
perimeters = 4
extrusion_width = 0.52
perimeter_extrusion_width = 0.52
external_perimeter_extrusion_width = 0.50
first_layer_extrusion_width = 0.60
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 22%
fill_pattern = gyroid
top_fill_pattern = monotonic
solid_infill_every_layers = 0
ensure_vertical_shell_thickness = 1

skirts = 0
brim_width = 5
support_material = 0
raft_layers = 0

perimeter_speed = 45
external_perimeter_speed = 30
small_perimeter_speed = 25
infill_speed = 70
solid_infill_speed = 60
top_solid_infill_speed = 35
travel_speed = 150
first_layer_speed = 20
bridge_speed = 25

start_gcode = G90\nM82\nM140 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nG28\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG92 E0\nG1 Z0.30 F3000\nG1 X6 Y6 F3000\nG1 X160 Y6 E12 F1200\nG1 X160 Y6.6 E12.6 F1200\nG1 X6 Y6.6 E24 F1200\nG92 E0\nG1 Z1 F3000
end_gcode = M104 S0\nM140 S0\nG91\nG1 E-2 F1800\nG1 Z10 F3000\nG90\nG1 X0 Y300 F6000\nM84
