# PrusaSlicer config - Raise3D N2 (300x300x300), PETG, SHADOW front lidar mount
#
# NOT the enclosure profile. Different material on purpose: the front mount is
# an OUTDOOR structural cantilever on a vehicle parked in the Tunisian sun.
# PLA's Tg is ~60 C and it creeps under sustained load - both disqualifying.
# PETG here; ASA is the alternative if UV exposure is long-term (PETG yellows
# and loses toughness under UV over a year or two, but prints far easier).
#
# Structural, so heavier than the enclosure profile:
#   perimeters 5 (vs 6 on the enclosure, but that was a WALL-THICKNESS match,
#     not strength - here 5 x 0.45 = 2.25 mm of shell carries the bending)
#   fill_density 40% gyroid - gyroid over grid because the load is bending in
#     more than one plane and grid is directional
#   bottom/top solid layers up, so the bolt bosses have material to bear on
#
# PETG-specific:
#   - fan LOW (30-50%). PETG layer adhesion collapses with a cold blast, and
#     layer adhesion is exactly what a cantilever needs. Do not raise this.
#   - retract 1.6 @ 30 - PETG strings; slower retract beats longer retract
#   - first layer slow and hot, bed 80
#   - z_offset untouched: PETG wants a slightly LOOSER first layer than PLA.
#     If the first layer looks squashed, raise z_offset, do not lower flow.
#
# ORIENTATION: all three STLs export sitting at z >= 0 needing no support.
# DO NOT re-orient them in the slicer.
#   cradle     - prints on its SIDE, the C profile lying in the bed plane and
#                extruding straight up. ~1400 mm2 of bed contact, zero
#                overhang. Base-down would leave the roof a 110 mm bridge.
#   elbow      - arm socket lying, vertical socket rising
#   deck_clamp - flange face down, socket rising
#
# Supports OFF and they must stay off - the sockets are square through-holes
# that bridge fine, and support inside a tube socket is unremovable.
printer_technology = FFF
gcode_flavor = marlin
bed_shape = 0x0,300x0,300x300,0x300
max_print_height = 300
nozzle_diameter = 0.4
z_offset = 0
use_relative_e_distances = 0
use_firmware_retraction = 0
retract_length = 1.6
retract_speed = 30
deretract_speed = 30
retract_lift = 0.2
retract_before_travel = 2

filament_diameter = 1.75
filament_type = PETG
filament_density = 1.27   # without this the gcode reports "filament used [g] = 0.00"
temperature = 240
first_layer_temperature = 245
bed_temperature = 80
first_layer_bed_temperature = 80
fan_always_on = 1
min_fan_speed = 30
max_fan_speed = 50
disable_fan_first_layers = 3
slowdown_below_layer_time = 15
min_print_speed = 10

layer_height = 0.20
first_layer_height = 0.25
perimeters = 5
extrusion_width = 0.45
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
top_solid_layers = 6
bottom_solid_layers = 5
fill_density = 40%
fill_pattern = gyroid
top_fill_pattern = monotonic
solid_infill_every_layers = 0
ensure_vertical_shell_thickness = 1

# brim only - no raft, no support
skirts = 0
brim_width = 5
support_material = 0
raft_layers = 0

perimeter_speed = 30
external_perimeter_speed = 22
small_perimeter_speed = 20
infill_speed = 45
solid_infill_speed = 40
top_solid_infill_speed = 25
travel_speed = 120
first_layer_speed = 18
bridge_speed = 25

start_gcode = G90\nM82\nM140 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nG28\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG92 E0\nG1 Z0.25 F3000\nG1 X6 Y6 F3000\nG1 X160 Y6 E12 F1200\nG1 X160 Y6.6 E12.6 F1200\nG1 X6 Y6.6 E24 F1200\nG92 E0\nG1 Z1 F3000
end_gcode = M104 S0\nM140 S0\nG91\nG1 E-2 F1800\nG1 Z10 F3000\nG90\nG1 X0 Y300 F6000\nM84
